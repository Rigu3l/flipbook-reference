<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactions — Flipbook Reference</title>
  <script src="js/vendor/tailwind.js"></script>
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/vendor/pdf.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/interactions.js" defer></script>
  <style>
    #page-wrap { position: relative; display: inline-block; }
    #page-wrap canvas { display: block; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
    #select-box { position: absolute; border: 2px dashed #059669; background: rgba(5,150,105,.12); display: none; pointer-events: none; }
    .hotspot-preview { position: absolute; border: 2px solid #7c5cff; background: rgba(124,92,255,.15); cursor: pointer; }
    .hotspot-preview:hover { background: rgba(124,92,255,.3); }
    .hotspot-preview .hotspot-label { position: absolute; top: -20px; left: 0; font-size: 11px; font-weight: 600; color: #7c5cff; white-space: nowrap; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
      <a href="dashboard.html" class="text-sm font-medium text-slate-600 hover:text-emerald-700">&larr; Dashboard</a>
      <h1 id="page-title" class="min-w-0 flex-1 truncate text-center font-semibold">Interactions</h1>
      <a id="view-link" href="#" class="text-sm font-medium text-emerald-700 hover:text-emerald-800">View flipbook</a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">
    <div id="ia-error" class="mb-4 hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"></div>
    <div id="ia-loading" class="py-20 text-center text-slate-500">
      <p class="text-lg font-medium">Loading flipbook…</p>
    </div>

    <div id="ia-main" class="hidden">
      <p class="text-sm text-slate-600">Drag a rectangle on a page to add an interaction. Click an existing area to edit it.</p>

      <!-- Page picker -->
      <div class="mt-4 flex items-center gap-2">
        <button id="ia-prev" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40">&larr; Prev</button>
        <label class="text-sm text-slate-600" for="ia-page-select">Page</label>
        <select id="ia-page-select" class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm font-medium text-slate-700"></select>
        <span id="ia-page-count" class="text-sm text-slate-500"></span>
        <button id="ia-next" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40">Next &rarr;</button>
      </div>

      <div class="mt-6 grid gap-6 lg:grid-cols-[1fr_320px]">
        <!-- Page canvas + selection -->
        <div class="overflow-auto rounded-xl border border-slate-200 bg-white p-4 text-center">
          <div id="page-wrap">
            <canvas id="ia-canvas"></canvas>
            <div id="select-box"></div>
            <div id="hotspot-layer"></div>
          </div>
        </div>

        <!-- Config form + list -->
        <div class="space-y-6">
          <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
            <h2 class="font-semibold">New interaction</h2>
            <p id="ia-selection-hint" class="mt-1 text-sm text-slate-500">Drag on the page to select an area first.</p>
            <div id="ia-form" class="mt-3 hidden space-y-3">
              <div>
                <label for="ia-type" class="block text-sm font-medium text-slate-700">Type</label>
                <select id="ia-type" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm">
                  <option value="link">Link</option>
                  <option value="image">Image</option>
                  <option value="video">Video</option>
                  <option value="audio">Audio</option>
                  <option value="web">Web</option>
                </select>
              </div>

              <!-- Link config -->
              <div id="ia-cfg-link" class="space-y-3">
                <div>
                  <label for="ia-link-action" class="block text-sm font-medium text-slate-700">Action on click</label>
                  <select id="ia-link-action" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm">
                    <option value="page">Go to page</option>
                    <option value="url">Open link</option>
                    <option value="zoom">Zoom</option>
                    <option value="popup">Popup</option>
                  </select>
                </div>
                <div id="ia-link-page-row">
                  <label for="ia-link-page" class="block text-sm font-medium text-slate-700">Target page</label>
                  <input id="ia-link-page" type="number" min="1" value="1" class="mt-1 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm">
                </div>
                <div id="ia-link-url-row" class="hidden">
                  <label for="ia-link-url" class="block text-sm font-medium text-slate-700">URL</label>
                  <input id="ia-link-url" type="url" placeholder="https://…" class="mt-1 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm">
                  <label class="mt-2 flex items-center gap-2 text-sm text-slate-700"><input id="ia-link-newtab" type="checkbox" checked class="accent-emerald-600"> Open in a new tab</label>
                </div>
                <div id="ia-link-zoom-row" class="hidden">
                  <label for="ia-link-zoom" class="block text-sm font-medium text-slate-700">Zoom level</label>
                  <select id="ia-link-zoom" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm">
                    <option value="1.25">125%</option>
                    <option value="1.5" selected>150%</option>
                    <option value="2">200%</option>
                    <option value="3">300%</option>
                  </select>
                </div>
                <div id="ia-link-popup-row" class="hidden space-y-3">
                  <div>
                    <label for="ia-link-popup-type" class="block text-sm font-medium text-slate-700">Popup content</label>
                    <select id="ia-link-popup-type" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm">
                      <option value="image">Picture</option>
                      <option value="video">Video</option>
                      <option value="web">Web page</option>
                    </select>
                  </div>
                  <div>
                    <label for="ia-link-popup-url" class="block text-sm font-medium text-slate-700">Content URL</label>
                    <input id="ia-link-popup-url" type="url" placeholder="https://…" class="mt-1 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm">
                  </div>
                </div>
                <label class="flex items-center gap-2 text-sm text-slate-700"><input id="ia-link-highlight" type="checkbox" class="accent-emerald-600"> Highlight the area</label>
              </div>

              <!-- Image config -->
              <div id="ia-cfg-image" class="hidden space-y-3">
                <div>
                  <label for="ia-image-url" class="block text-sm font-medium text-slate-700">Image URL</label>
                  <input id="ia-image-url" type="url" placeholder="https://…/image.jpg" class="mt-1 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm">
                </div>
              </div>

              <!-- Video config -->
              <div id="ia-cfg-video" class="hidden space-y-3">
                <div>
                  <label for="ia-video-url" class="block text-sm font-medium text-slate-700">Video URL (YouTube or direct .mp4)</label>
                  <input id="ia-video-url" type="url" placeholder="https://www.youtube.com/watch?v=… or https://…/video.mp4" class="mt-1 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm">
                </div>
                <label class="flex items-center gap-2 text-sm text-slate-700"><input id="ia-video-muted" type="checkbox" class="accent-emerald-600"> Muted</label>
                <label class="flex items-center gap-2 text-sm text-slate-700"><input id="ia-video-autoplay" type="checkbox" class="accent-emerald-600"> Play automatically</label>
                <label class="flex items-center gap-2 text-sm text-slate-700"><input id="ia-video-controls" type="checkbox" checked class="accent-emerald-600"> Show player controls</label>
              </div>

              <!-- Audio config -->
              <div id="ia-cfg-audio" class="hidden space-y-3">
                <div>
                  <label for="ia-audio-url" class="block text-sm font-medium text-slate-700">Audio URL</label>
                  <input id="ia-audio-url" type="url" placeholder="https://…/audio.mp3" class="mt-1 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm">
                </div>
                <div>
                  <label for="ia-audio-title" class="block text-sm font-medium text-slate-700">Title</label>
                  <input id="ia-audio-title" type="text" placeholder="Audio title" class="mt-1 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm">
                </div>
              </div>

              <!-- Web config -->
              <div id="ia-cfg-web" class="hidden space-y-3">
                <div>
                  <label for="ia-web-url" class="block text-sm font-medium text-slate-700">Web address or iframe code</label>
                  <input id="ia-web-url" type="text" placeholder="https://… or <iframe …>" class="mt-1 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm">
                </div>
                <label class="flex items-center gap-2 text-sm text-slate-700"><input id="ia-web-noscroll" type="checkbox" class="accent-emerald-600"> Disable scroll bars</label>
              </div>

              <div class="flex gap-2">
                <button id="ia-add" type="button" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">Add interaction</button>
                <button id="ia-cancel" type="button" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">Cancel</button>
              </div>
            </div>
          </section>

          <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
            <h2 class="font-semibold">Interactions on this page</h2>
            <div id="ia-list" class="mt-3 space-y-2">
              <p class="text-sm text-slate-500">None yet.</p>
            </div>
            <div class="mt-4 flex items-center gap-3">
              <button id="ia-save" type="button" class="rounded-lg bg-emerald-600 px-5 py-2.5 font-medium text-white hover:bg-emerald-700">Save interactions</button>
              <p id="ia-status" class="text-sm text-slate-500"></p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
