<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — Flipbook Reference</title>
  <script src="js/vendor/tailwind.js"></script>
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/account.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a href="index.html" class="text-lg font-bold tracking-tight">Flipbook <span class="text-emerald-600">Reference</span></a>
      <nav id="nav-auth" class="flex items-center gap-4"></nav>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-10">
    <h1 class="text-2xl font-bold">Account</h1>
    <p id="account-loading" class="mt-2 text-sm text-slate-500">Loading…</p>

    <div id="account-main" class="mt-6 hidden space-y-6">
      <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="font-semibold">Signed in as</h2>
        <p id="account-email" class="mt-1 text-slate-700"></p>
        <p id="account-meta" class="mt-1 text-sm text-slate-500"></p>
      </section>

      <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="font-semibold">Change password</h2>
        <form id="change-pw-form" class="mt-4 space-y-4">
          <div>
            <label for="change-new-password" class="block text-sm font-medium text-slate-700">New password</label>
            <input id="change-new-password" type="password" required minlength="6" autocomplete="new-password"
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-emerald-500 focus:outline-none">
          </div>
          <div>
            <label for="change-confirm-password" class="block text-sm font-medium text-slate-700">Confirm new password</label>
            <input id="change-confirm-password" type="password" required minlength="6" autocomplete="new-password"
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-emerald-500 focus:outline-none">
          </div>
          <p id="change-pw-error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></p>
          <div class="flex items-center gap-3">
            <button id="change-pw-submit" type="submit" class="rounded-lg bg-emerald-600 px-5 py-2 text-sm font-medium text-white hover:bg-emerald-700">Change password</button>
            <p id="change-pw-status" class="text-sm text-slate-500"></p>
          </div>
        </form>
      </section>

      <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="font-semibold">Sign out</h2>
        <p class="mt-1 text-sm text-slate-500">Sign out of this browser. Your flipbooks stay saved.</p>
        <button id="account-signout" type="button" class="mt-4 rounded-lg border border-slate-300 bg-white px-5 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">Sign out</button>
      </section>
    </div>
  </main>
</body>
</html>
