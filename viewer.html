<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reader — Flipbook Reference</title>
  <script src="js/vendor/tailwind.js"></script>
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/vendor/pdf.min.js"></script>
  <script src="js/vendor/page-flip.browser.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/viewer.js?v=f5" defer></script>
  <style>
    #stage-inner { transition: transform .18s ease, opacity .18s ease; }
    /* StPageFlip book (Magazine mode, same library + config as Manuazine). */
    #book-wrap { transform-origin: top center; transition: width .3s ease; }
    #book { box-shadow: 0 20px 50px rgba(0,0,0,.5); background: #fff; transition: margin-left .3s ease; }
    #book .page { background: #fff; }
    #book img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .flip-spine { position: absolute; width: 26px; background: linear-gradient(to right, transparent, rgba(0,0,0,.14), transparent); pointer-events: none; }
    /* Hover a turnable page: its outer edge lifts toward the viewer,
       like the page starting to turn; pointer cursor, click turns it. */
    #stage-inner canvas.page-turn-next, #stage-inner canvas.page-turn-prev { cursor: pointer; transition: transform .25s ease, box-shadow .25s ease; }
    #stage-inner canvas.page-turn-next { transform-origin: left center; }
    #stage-inner canvas.page-turn-next:hover { transform: perspective(3000px) rotateY(-18deg); box-shadow: -16px 8px 28px rgba(0,0,0,.25); }
    #stage-inner canvas.page-turn-prev { transform-origin: right center; }
    #stage-inner canvas.page-turn-prev:hover { transform: perspective(3000px) rotateY(18deg); box-shadow: 16px 8px 28px rgba(0,0,0,.25); }
    #stage-inner.slide-next { transform: translateX(-48px); opacity: .4; }
    #stage-inner.slide-prev { transform: translateX(48px); opacity: .4; }
    #stage-inner.fade-out { opacity: 0; }
    #coverflow { position: relative; height: 360px; perspective: 1200px; }
    .cf-card { position: absolute; left: 50%; top: 50%; transition: transform .35s ease, opacity .35s ease; cursor: pointer; }
    .cf-card canvas { display: block; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
      <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-emerald-700">&larr; All flipbooks</a>
      <h1 id="viewer-title" class="min-w-0 flex-1 truncate text-center font-semibold">Loading…</h1>
      <span id="page-label" class="whitespace-nowrap text-sm text-slate-500"></span>
    </div>
  </header>

  <!-- Reader toolbar: thumbnails, zoom, fullscreen -->
  <div id="toolbar" class="hidden border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-2 px-4 py-2">
      <label class="text-sm text-slate-600" for="mode-select">View</label>
      <select id="mode-select" class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm font-medium text-slate-700">
        <option value="magazine">Magazine (page flip)</option>
        <option value="slider">Slider</option>
        <option value="fade">Fade</option>
        <option value="coverflow">Coverflow</option>
        <option value="onepage">One page</option>
      </select>
      <button id="btn-thumbs" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100" aria-expanded="false">Thumbnails</button>
      <span class="mx-1 hidden h-6 w-px bg-slate-200 sm:block"></span>
      <button id="btn-zoom-out" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40" aria-label="Zoom out">&minus;</button>
      <span id="zoom-label" class="w-12 text-center text-sm text-slate-600">100%</span>
      <button id="btn-zoom-in" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40" aria-label="Zoom in">+</button>
      <button id="btn-zoom-fit" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100">Fit</button>
      <span class="mx-1 hidden h-6 w-px bg-slate-200 sm:block"></span>
      <button id="btn-fullscreen" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100">Fullscreen</button>
    </div>
  </div>

  <!-- Thumbnails panel -->
  <aside id="thumbs-panel" class="fixed bottom-0 left-0 top-[105px] z-30 hidden w-44 overflow-y-auto border-r border-slate-200 bg-white p-3 shadow-lg" aria-label="Page thumbnails">
    <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Pages</p>
    <div id="thumbs-list" class="flex flex-col gap-3"></div>
  </aside>

  <main class="relative mx-auto flex max-w-6xl flex-col items-center px-4 py-6">
    <div id="bg-layer" class="pointer-events-none absolute inset-0 hidden" aria-hidden="true"></div>
    <div id="book-meta" class="relative z-10 mb-4 hidden max-w-2xl text-center">
      <p id="book-subtitle" class="text-lg font-medium text-slate-700"></p>
      <p id="book-description" class="mt-1 text-sm text-slate-500"></p>
    </div>
    <div id="loading" class="relative z-10 py-20 text-center text-slate-500">
      <p class="text-lg font-medium">Loading flipbook…</p>
    </div>
    <div id="error" class="hidden w-full max-w-lg rounded-xl border border-red-200 bg-red-50 px-6 py-8 text-center">
      <p id="error-text" class="font-medium text-red-800">This flipbook could not be loaded.</p>
      <a href="index.html" class="mt-4 inline-block rounded-lg bg-emerald-600 px-5 py-2.5 font-medium text-white hover:bg-emerald-700">Back to all flipbooks</a>
    </div>

    <div id="stage" class="hidden w-full select-none overflow-auto" style="max-height: calc(100vh - 260px)">
      <div id="stage-inner" class="relative mx-auto flex w-max overflow-hidden"></div>
      <div id="book-wrap" class="mx-auto hidden w-max"><div id="book"></div></div>
      <div id="coverflow" class="hidden"></div>
    </div>

    <div id="controls" class="relative z-10 mt-6 hidden w-full max-w-3xl items-center gap-3">
      <button id="btn-first" type="button" class="shrink-0 rounded-lg border border-slate-300 bg-white px-3 py-2.5 font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40" aria-label="First page">&laquo; First</button>
      <button id="btn-prev" type="button" class="shrink-0 rounded-lg border border-slate-300 bg-white px-5 py-2.5 font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40">&larr; Prev</button>
      <input id="page-slider" type="range" min="1" max="1" step="1" value="1" class="min-w-0 flex-1 accent-emerald-600" aria-label="Go to page">
      <button id="btn-next" type="button" class="shrink-0 rounded-lg bg-emerald-600 px-5 py-2.5 font-medium text-white hover:bg-emerald-700 disabled:opacity-40">Next &rarr;</button>
      <button id="btn-last" type="button" class="shrink-0 rounded-lg border border-slate-300 bg-white px-3 py-2.5 font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-40" aria-label="Last page">Last &raquo;</button>
    </div>
    <p class="mt-3 hidden text-xs text-slate-400" id="hint">Use the arrow keys or the buttons to turn pages.</p>
  </main>
</body>
</html>
