<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Flipbook Reference</title>
  <script src="js/vendor/tailwind.js"></script>
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/reset-password.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a href="index.html" class="text-lg font-bold tracking-tight">Flipbook <span class="text-emerald-600">Reference</span></a>
      <nav id="nav-auth" class="flex items-center gap-4"></nav>
    </div>
  </header>

  <main class="mx-auto max-w-md px-4 py-16">
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <h1 class="text-xl font-bold">Set a new password</h1>
      <p id="reset-state" class="mt-1 text-sm text-slate-500">Checking your reset link…</p>
      <form id="reset-pw-form" class="mt-6 hidden space-y-4">
        <div>
          <label for="new-password" class="block text-sm font-medium text-slate-700">New password</label>
          <input id="new-password" type="password" required minlength="6" autocomplete="new-password"
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
          <label for="confirm-password" class="block text-sm font-medium text-slate-700">Confirm new password</label>
          <input id="confirm-password" type="password" required minlength="6" autocomplete="new-password"
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-emerald-500 focus:outline-none">
        </div>
        <p id="reset-pw-error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></p>
        <button id="reset-pw-submit" type="submit" class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 font-medium text-white hover:bg-emerald-700">Set new password</button>
      </form>
      <p class="mt-4 text-center text-sm">
        <a href="auth.html" class="font-medium text-emerald-700 hover:text-emerald-800">Back to sign in</a>
      </p>
    </div>
  </main>
</body>
</html>
